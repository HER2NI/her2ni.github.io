<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title description">
  <title id="title">H.E.R Ring™</title>
  <desc id="description">The static H.E.R Ring™: a dark circle with a restrained cyan and electric-blue luminous perimeter.</desc>
  <defs>
    <radialGradient id="centre" cx="45%" cy="40%" r="62%">
      <stop offset="0" stop-color="#0b1720" />
      <stop offset="0.72" stop-color="#050b11" />
      <stop offset="1" stop-color="#020609" />
    </radialGradient>
    <linearGradient id="perimeter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72f7ff" />
      <stop offset="0.48" stop-color="#19c8ee" />
      <stop offset="1" stop-color="#1976ff" />
    </linearGradient>
    <filter id="wide-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="near-halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <circle cx="320" cy="320" r="250" fill="none" stroke="#19c8ee" stroke-width="18" opacity="0.13" filter="url(#wide-halo)" />
  <circle cx="320" cy="320" r="250" fill="none" stroke="url(#perimeter)" stroke-width="8" opacity="0.28" filter="url(#near-halo)" />
  <circle cx="320" cy="320" r="250" fill="url(#centre)" stroke="url(#perimeter)" stroke-width="3" />
  <circle cx="320" cy="320" r="244" fill="none" stroke="#b9fbff" stroke-width="0.8" opacity="0.42" />
</svg>
