<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title description">
  <title id="title">H.E.R Ring™</title>
  <desc id="description">The static H.E.R Ring™: one blue-white luminous circular boundary blooming around a dark centre.</desc>
  <defs>
    <radialGradient id="centre" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#071428" />
      <stop offset="0.72" stop-color="#020a16" />
      <stop offset="1" stop-color="#01050c" />
    </radialGradient>
    <linearGradient id="perimeter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdff" />
      <stop offset="0.34" stop-color="#8deeff" />
      <stop offset="0.7" stop-color="#268dff" />
      <stop offset="1" stop-color="#bff8ff" />
    </linearGradient>
    <filter id="wide-halo" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="27" />
    </filter>
    <filter id="near-halo" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="soft-halo" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <circle cx="320" cy="320" r="216" fill="url(#centre)" />
  <circle cx="320" cy="320" r="216" fill="none" stroke="#168fff" stroke-width="32" opacity="0.16" filter="url(#wide-halo)" />
  <circle cx="320" cy="320" r="216" fill="none" stroke="url(#perimeter)" stroke-width="14" opacity="0.32" filter="url(#near-halo)" />
  <circle cx="320" cy="320" r="216" fill="none" stroke="#8fefff" stroke-width="6" opacity="0.56" filter="url(#soft-halo)" />
  <circle cx="320" cy="320" r="216" fill="none" stroke="url(#perimeter)" stroke-width="4" />
</svg>
